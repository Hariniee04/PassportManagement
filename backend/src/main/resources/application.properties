spring.application.name=passport-backend
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3307/passport_management
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Change these through environment variables before a real deployment.
app.staff-password.passport-officer=${PASSPORT_OFFICER_PASSWORD:PASSPORT@2026}
app.staff-password.verification-officer=${VERIFICATION_OFFICER_PASSWORD:VERIFY@2026}
app.staff-password.admin=${ADMIN_PASSWORD:ADMIN@2026}
