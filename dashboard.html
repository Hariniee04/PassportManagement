<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Passport Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand navbar-dark app-nav">
        <div class="container">
            <a class="navbar-brand" href="index.html">Passport Services</a>
            <button class="btn btn-light btn-sm px-3" id="logout">Logout</button>
        </div>
    </nav>

    <main class="container mt-5">
        <section class="card shadow-sm p-4 p-md-5">
            <h1 class="text-center">Welcome, <span id="username"></span></h1>
            <p class="text-center text-muted mb-4">Select an option below to view available passport services.</p>

            <div class="row g-3">
                <div class="col-md-4"><button type="button" class="btn btn-outline-primary w-100 p-3">Apply for a new passport</button></div>
                <div class="col-md-4"><button type="button" class="btn btn-outline-primary w-100 p-3">Renew passport</button></div>
                <div class="col-md-4"><button type="button" class="btn btn-outline-primary w-100 p-3">Track application status</button></div>
                <div class="col-md-4"><button type="button" class="btn btn-outline-primary w-100 p-3">Upload documents</button></div>
                <div class="col-md-4"><button type="button" class="btn btn-outline-primary w-100 p-3">Update personal details</button></div>
                <div class="col-md-4"><button type="button" class="btn btn-outline-primary w-100 p-3">General information</button></div>
            </div>

            <p class="text-center text-muted mt-5 mb-0">This dashboard will be updated with additional features later.</p>
        </section>
    </main>

    <script src="js/dashboard.js"></script>
</body>
</html>
