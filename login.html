<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Passport Services</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
    <nav class="navbar navbar-expand navbar-dark app-nav">
        <div class="container"><a class="navbar-brand" href="index.html">Passport Services</a></div>
    </nav>
    <main class="auth-main container">
        <div class="text-center mb-4">
            <span class="eyebrow">SECURE ACCESS</span>
            <h1>Sign in</h1>
            <p class="text-muted">Choose the login box for your role.</p>
        </div>
        <div class="row g-4 justify-content-center">
            <div class="col-sm-10 col-md-6 col-xl-3">
                <section class="auth-card h-100">
                    <h2 class="h4">Applicant</h2>
                    <p class="text-muted small">Use the account you registered.</p>
                    <form class="applicant-login-form">
                        <div class="mb-3"><label for="applicantEmail" class="form-label">Email address</label><input id="applicantEmail" type="email" class="form-control" required></div>
                        <div class="mb-3"><label for="applicantPassword" class="form-label">Password</label><input id="applicantPassword" type="password" class="form-control" required></div>
                        <button class="btn btn-primary w-100" type="submit">Applicant Login</button>
                    </form>
                    <a href="register.html" class="btn btn-outline-primary w-100 mt-3">Create applicant account</a>
                </section>
            </div>
            <div class="col-sm-10 col-md-6 col-xl-3">
                <section class="auth-card h-100">
                    <h2 class="h4">Passport Officer</h2>
                    <form class="staff-login-form" data-role="PASSPORT_OFFICER">
                        <div class="mb-3"><label class="form-label">Name</label><input name="name" type="text" class="form-control" required></div>
                        <div class="mb-3"><label class="form-label">Officer ID</label><input name="staffId" type="text" class="form-control" required></div>
                        <div class="mb-3"><label class="form-label">Assigned Password</label><input name="password" type="password" class="form-control" required></div>
                        <button class="btn btn-primary w-100" type="submit">Officer Login</button>
                    </form>
                </section>
            </div>
            <div class="col-sm-10 col-md-6 col-xl-3">
                <section class="auth-card h-100">
                    <h2 class="h4">Verification Officer</h2>
                    <form class="staff-login-form" data-role="VERIFICATION_OFFICER">
                        <div class="mb-3"><label class="form-label">Name</label><input name="name" type="text" class="form-control" required></div>
                        <div class="mb-3"><label class="form-label">Officer ID</label><input name="staffId" type="text" class="form-control" required></div>
                        <div class="mb-3"><label class="form-label">Assigned Password</label><input name="password" type="password" class="form-control" required></div>
                        <button class="btn btn-primary w-100" type="submit">Officer Login</button>
                    </form>
                </section>
            </div>
            <div class="col-sm-10 col-md-6 col-xl-3">
                <section class="auth-card h-100">
                    <h2 class="h4">Administrator</h2>
                    <form class="staff-login-form" data-role="ADMIN">
                        <div class="mb-3"><label class="form-label">Name</label><input name="name" type="text" class="form-control" required></div>
                        <div class="mb-3"><label class="form-label">Admin ID</label><input name="staffId" type="text" class="form-control" required></div>
                        <div class="mb-3"><label class="form-label">Assigned Password</label><input name="password" type="password" class="form-control" required></div>
                        <button class="btn btn-primary w-100" type="submit">Admin Login</button>
                    </form>
                </section>
            </div>
        </div>
    </main>
    <script src="js/login.js"></script>
</body>
</html>
