<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Passport Services</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
    <nav class="navbar navbar-expand navbar-dark app-nav">
        <div class="container"><a class="navbar-brand" href="index.html">Passport Services</a></div>
    </nav>
    <main class="auth-main container">
        <div class="row justify-content-center">
            <div class="col-sm-10 col-md-7 col-lg-5">
                <section class="auth-card">
                    <div class="text-center mb-4">
                        <span class="eyebrow">SECURE ACCESS</span>
                        <h1>Welcome back</h1>
                        <p class="text-muted mb-0">Sign in to access passport services.</p>
                    </div>
                    <form id="loginform">
                        <div class="mb-3">
                            <label for="role" class="form-label">Sign in as</label>
                            <select id="role" class="form-select" required>
                                <option value="" selected disabled>Select your role</option>
                                <option value="applicant">Applicant</option>
                                <option value="verification">Verification Officer</option>
                                <option value="passport">Passport Officer</option>
                                <option value="police">Police Officer</option>
                                <option value="admin">Administrator</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email address</label>
                            <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Login</button>
                    </form>
                    <div class="auth-divider"><span>New to Passport Services?</span></div>
                    <a href="register.html" class="btn btn-outline-primary w-100">Create an account</a>
                </section>
            </div>
        </div>
    </main>
    <script src="js/login.js"></script>
</body>
</html>
