<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Passport Services</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
    <nav class="navbar navbar-expand navbar-dark app-nav"><div class="container"><a class="navbar-brand" href="index.html">Passport Services</a></div></nav>
    <main class="auth-main container"><section class="auth-card single-auth-card">
        <a class="back-link" href="index.html">&larr; Choose another role</a>
        <span class="eyebrow" id="roleLabel">SECURE ACCESS</span><h1 id="loginTitle">Sign in</h1><p class="text-muted" id="loginDescription"></p>
        <form id="loginForm">
            <div id="staffFields" hidden><div class="mb-3"><label for="staffName" class="form-label">Name</label><input id="staffName" type="text" class="form-control"></div><div class="mb-3"><label for="staffId" class="form-label">Staff ID</label><input id="staffId" type="text" class="form-control"></div></div>
            <div class="mb-3" id="emailGroup"><label for="email" class="form-label">Email address</label><input id="email" type="email" class="form-control" required></div>
            <div class="mb-3"><label for="password" class="form-label">Password</label><input id="password" type="password" class="form-control" required></div>
            <button class="btn btn-primary w-100" id="loginButton" type="submit">Sign in</button>
        </form>
        <a id="registerLink" href="register.html" class="btn btn-outline-primary w-100 mt-3">Create applicant account</a>
    </section></main>
    <script src="js/login.js"></script>
</body>
</html>
